<!-- ═══════════════════════════════════════════════════════════
     ⚠ 이 파일은 "눈으로 확인하는 용도" 입니다.
       네이버에 붙여넣지 마세요.

     네이버 스마트에디터 ONE 은 HTML 글쓰기를 지원하지 않습니다.
     HTML을 통째로 붙여넣으면 서식이 깨지거나 숨은 태그가 섞일 수 있습니다.

     실제로 올릴 때는 같은 폴더의 publish/ 안에 있는 자료를 쓰세요.
       publish/upload_checklist.md   ← 순서대로 따라가면 됩니다
       publish/body.txt              ← 본문 (순수 텍스트)
       publish/blocks.yaml           ← 소제목·이미지 넣는 자리
       publish/images/               ← 포토 업로더로 올릴 이미지
     ═══════════════════════════════════════════════════════════ -->
<div style="max-width:720px;margin:0 auto 20px;padding:14px 18px;
     background:#FFF5F5;border:1px solid #FEB2B2;border-radius:8px;
     font-family:'맑은 고딕','Malgun Gothic',sans-serif;font-size:14px;color:#822727;">
  <b>미리보기 전용입니다.</b> 이 화면을 복사해서 네이버에 붙여넣지 마세요.
  실제 업로드는 <code>publish/upload_checklist.md</code> 를 따라 주세요.
</div>

<div class="post" style="max-width:720px;margin:0 auto;padding:24px;
     font-family:'맑은 고딕','Malgun Gothic',AppleSDGothicNeo-Regular,sans-serif;
     font-size:{{font_size}};line-height:{{line_height}};color:#222;">

  <h1 style="font-size:1.55em;line-height:1.4;margin:0 0 8px;color:{{primary_color}};">
    {{title}}
  </h1>

  <p style="margin:0 0 24px;font-size:.85em;color:#888;">
    {{channel_name}} · {{publish_date}} ({{weekday_ko}})
  </p>

{{body}}

</div>
