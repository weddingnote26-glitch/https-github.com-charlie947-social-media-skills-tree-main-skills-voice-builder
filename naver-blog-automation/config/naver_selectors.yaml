# ═══════════════════════════════════════════════════════════════
#  네이버 글쓰기 화면의 요소 위치표
#
#  ⚠ 이 값들은 **아직 확인되지 않았습니다.**
#     네이버 화면 구조는 자주 바뀌고, 계정·기기마다 다를 수 있습니다.
#     확인하지 않은 값으로 자동 조작하면 엉뚱한 곳을 누를 수 있어
#     이 시스템은 확인 전에는 자동 입력을 하지 않습니다.
#
#  확인하는 방법
#     python scripts/browser_publish.py --calibrate
#     → 브라우저가 열리면 직접 로그인하고 글쓰기 화면까지 간 뒤
#       화면의 안내를 따라가면 됩니다.
#       찾은 것은 verified: true 로 기록됩니다.
#
#  하나라도 찾지 못하면 그 자리에서 멈추고 알려 줍니다.
#  (네이버가 화면을 바꿨다는 뜻이므로 사람이 확인해야 합니다)
# ═══════════════════════════════════════════════════════════════
version: 1
verified: false          # --calibrate 를 통과하면 true 가 됩니다
verified_at: null
verified_on: null        # 확인한 PC 이름

# 글쓰기 주소 (blogId 는 실행할 때 채워집니다)
urls:
  write: "https://blog.naver.com/{blog_id}?Redirect=Write"
  manage: "https://admin.blog.naver.com/{blog_id}"

# 로그인이 되어 있는지 판별할 때 쓰는 표시
login_markers:
  logged_out_url_contains: ["nid.naver.com", "/login"]
  # 아래 문구가 화면에 보이면 사람이 직접 처리해야 하는 상황입니다.
  needs_human:
    - "자동입력 방지"
    - "보안"
    - "인증"
    - "새로운 기기"
    - "로그인이 제한"
    - "비정상적인"

# 에디터 요소 — 확인 전에는 비어 있습니다.
# --calibrate 가 실제 화면에서 찾아 채웁니다.
editor:
  iframe: null           # 예: "iframe#mainFrame"
  title_input: null
  body_input: null
  publish_button: null
  schedule_toggle: null
  schedule_date: null
  schedule_time: null
  category_select: null
  visibility_closed: null
  tag_input: null
  confirm_button: null

# 확인 결과 기록 (--calibrate 가 채웁니다)
calibration_log: []
