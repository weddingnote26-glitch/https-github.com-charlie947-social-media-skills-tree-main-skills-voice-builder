# ═══════════════════════════════════════════════════════════════
#  금지·주의 표현 사전 — scripts/review.py 가 자동 검사합니다.
#  severity: block(발행 불가) / warn(사람이 확인)
# ═══════════════════════════════════════════════════════════════
version: 1

groups:

  # ── 수익 보장 (절대 금지) ──────────────────────────────
  - id: profit_guarantee
    label: 수익 보장 표현
    severity: block
    applies_to: [coin, stock]
    patterns:
      - "무조건 오른다"
      - "무조건 상승"
      - "반드시 오른다"
      - "확실한 수익"
      - "수익 보장"
      - "손실은 없습니다"
      - "손실 없는 투자"
      - "절대 손실"
      - "원금 보장"
      - "100% 수익"
      - "百% 수익"
      - "절대 안 떨어"
      - "떨어질 리 없"
      - "따라만 하면"
      - "누구나 부자"
      - "돈 버는 법 알려"
      - "수익률 보장"
      - "확정 수익"

  # ── 매수·매도 유도 (절대 금지) ─────────────────────────
  - id: trade_solicitation
    label: 매수·매도 유도
    severity: block
    applies_to: [coin, stock]
    patterns:
      - "지금 사세요"
      - "지금 매수"
      - "지금 담으"
      - "사야 합니다"
      - "사야 할 때"
      - "매수 추천"
      - "매도 추천"
      - "강력 추천 종목"
      - "지금 들어가"
      - "막차"
      - "지금이 기회"
      - "놓치면 후회"
      - "풀매수"
      - "몰빵"
      - "영끌"

  # ── 과도한 공포 조장 ───────────────────────────────────
  - id: fear_mongering
    label: 과도한 공포 유발
    severity: block
    applies_to: [coin, stock]
    patterns:
      - "폭락 온다"
      - "곧 망한다"
      - "전 재산"
      - "지금 팔지 않으면"
      - "대폭락 임박"
      - "파산"
      - "휴지조각"
      - "다 날린다"

  # ── 단정적 가격 예측 ───────────────────────────────────
  - id: price_prediction
    label: 단정적 가격·수익률 예측
    severity: warn
    applies_to: [coin, stock]
    patterns:
      - "갈 것입니다"
      - "도달합니다"
      - "돌파합니다"
      - "간다고 봅니다"
      - "목표가는"
      - "예상 수익률은"
      - "n배 간다"

  # ── 젊은 세대 은어 (오락 5070 경제공부소 전용 금지) ────
  - id: slang_5070
    label: 은어·유행어 (50~70대 독자 부적합)
    severity: block
    applies_to: [stock]
    patterns:
      - "ㄱㄱ"
      - "ㅇㅈ"
      - "개꿀"
      - "핵이득"
      - "존버"
      - "가즈아"
      - "떡상"
      - "떡락"
      - "찐"
      - "레전드"
      - "갓"
      - "킹"
      - "머스트해브"
      - "인정?"
      - "실화냐"

  # ── 코인 채널 은어 (완화 적용: 경고만) ─────────────────
  # 이 채널은 코인 커뮤니티 어휘를 일상적으로 씁니다.
  # (실제 발행 글에서 "떡상", "알트 불장" 등을 확인했습니다)
  # 그래서 어휘 자체는 막지 않고, 정말 부적절한 것만 남겼습니다.
  - id: slang_coin
    label: 과한 커뮤니티 은어
    severity: warn
    applies_to: [coin]
    patterns:
      - "가즈아"
      - "코인충"
      - "한강 가"
      - "지옥행"

  # ── 근거 없는 소문 ─────────────────────────────────────
  - id: rumor
    label: 출처 없는 소문·카더라
    severity: warn
    applies_to: [coin, stock]
    patterns:
      - "카더라"
      - "소문에 따르면"
      - "들리는 말로는"
      - "관계자에 따르면"
      - "익명의"
      - "확인되지 않았지만"

  # ── 표절·복제 위험 신호 ────────────────────────────────
  - id: copy_signal
    label: 외부 글 복제 의심 흔적
    severity: warn
    applies_to: [coin, stock]
    patterns:
      - "출처: 네이버 블로그"
      - "본 기사는"
      - "무단전재"
      - "재배포 금지"
      - "ⓒ"

# ── 반드시 들어가야 하는 문구 ─────────────────────────────
required_phrases:
  # 친절한 코인 설명서 — 실제 발행 글(2026-08-21)의 문구를 기준으로 맞췄습니다.
  #   "(※ 본 포스팅은 투자를 권유하는 글이 아니며,
  #     모든 투자의 책임은 본인에게 있습니다.)"
  coin:
    - id: coin_disclaimer
      label: 투자 판단 책임 고지
      any_of:
        - "모든 투자의 책임은 본인에게"
        - "투자의 책임은 본인에게"
        - "책임은 투자자 본인에게 있습니다"
        - "투자 판단과 그 결과에 대한 책임은 투자자 본인"
        - "투자에 대한 판단과 책임은 독자"
    - id: coin_no_solicit
      label: 투자 권유 아님 명시
      any_of:
        - "투자를 권유하는 글이 아"
        - "매수나 매도를 권유하지 않"
        - "권유하는 것이 아"
  # 오락 5070 경제공부소 — 실제 발행 글(2026-08-21)의 문구를 기준으로 맞췄습니다.
  #   "이 글은 주식과 경제를 공부하기 위한 교육 콘텐츠이며
  #    특정 종목의 매수·매도를 권유하는 글이 아닙니다."
  stock:
    - id: stock_edu_notice
      label: 교육 목적 명시
      any_of:
        - "교육 콘텐츠"
        - "교육 목적"
        - "공부하기 위한"
        - "공부를 돕기 위한"
    - id: stock_no_solicit
      label: 투자 권유 아님 명시
      any_of:
        - "권유하는 글이 아"
        - "권유하지 않"
        - "투자 권유가 아"
        - "권유하는 것이 아"

# ═══════════════════════════════════════════════════════════════
#  "하지 말라"는 문맥이면 봐주기
#
#  "몰빵 금지", "풀매수하면 고통스럽습니다" 처럼 위험한 행동을
#  말리는 문장에도 그 낱말은 들어갑니다. 그걸 유도로 오해하면
#  좋은 글이 막히고, 사용자는 검사를 꺼버리게 됩니다.
#
#  그래서 걸린 낱말 뒤(또는 앞)에 아래 표현이 가까이 있으면
#  '말리는 문장'으로 보고 통과시킵니다.
# ═══════════════════════════════════════════════════════════════
prohibitive_context:
  # 걸린 표현 뒤쪽 이 글자 수 안에서 찾습니다.
  window_after: 24
  window_before: 12
  markers:
    - 금지
    - 마세요
    - 마시고
    - 말고
    - 말아야
    - 않습니다
    - 않는
    - 안 됩니다
    - 피하
    - 삼가
    - 조심
    - 위험
    - 고통
    - 손실
    - 후회
    - 실수
    - 절대
    - 하지 말
