# ═══════════════════════════════════════════════════════════════
#  채널 프로필 — 두 블로그의 정체성·독자·문체 규칙
#  ※ blog_id 는 채널이 뒤바뀌는 사고를 막는 최종 기준값입니다.
#     절대 임의로 수정하지 마세요.
# ═══════════════════════════════════════════════════════════════
version: 1
timezone: Asia/Seoul

channels:

  # ─────────────────────────────────────────────────────────
  coin:
    key: coin
    name: 친절한 코인 설명서
    blog_id: dylankim26
    url: https://blog.naver.com/dylankim26
    # 발행 직전 사람이 눈으로 대조하는 확인 문구 (채널 혼동 방지)
    confirm_phrase: "친절한 코인 설명서 / dylankim26"

    audience:
      summary: 가상화폐와 코인 투자를 처음 시작한 사람
      knowledge_level: 입문
      assumed_age: 제한 없음
      pain_points:
        - 용어가 어려워 뉴스를 읽어도 이해가 안 됨
        - 무엇을 기준으로 판단해야 할지 모름
        - 급등락에 감정적으로 흔들림

    topics:
      - 가상화폐 주간·일간 시황
      - 코인 투자 마인드

    tone:
      voice: 차분하고 친절한 설명형
      rules:
        - 초보자도 이해할 수 있는 쉬운 한국어를 쓴다
        - 어려운 용어가 나오면 그 자리에서 바로 풀어서 설명한다
        - 문장은 길게 늘어뜨리지 않는다
      forbidden:
        - 과도한 가격 예측
        - 매수·매도 유도
        - 수익 보장 표현
      required:
        - 투자 판단과 책임은 독자에게 있다는 고지

    # 실제 블로그에서 쓰고 있는 문구 그대로입니다. (2026-08-21 글 기준)
    disclaimer: |
      (※ 본 포스팅은 투자를 권유하는 글이 아니며, 모든 투자의 책임은 본인에게 있습니다.)

    # 글 첫 줄 고정 인사말 — 템플릿에 따라 다릅니다 (실제 글에서 확인)
    greeting:
      market: "안녕하세요! 여러분의 소중한 시드를 안전하게 지켜드리는 친절한 코인 설명서 입니다."
      guide: "안녕하세요! 10년 차 실전 투자자, 여러분의 멘토 '친절한 코인 설명서'입니다. ☀️"

    # 글 끝 고정 문구
    footer: |
      오늘 하루도 화이팅하시고, 공감과 이웃추가는 양질의 콘텐츠를 이어가는 데 큰 힘이 됩니다! ❤️

    # 이 채널은 카테고리에 따라 틀이 두 개입니다. 섞어 쓰면 안 됩니다.
    templates:
      market:                       # 모닝 시황
        category: 코인시황뉴스
        title_prefix: "[친절한코인설명서]"
        title_format: "[친절한코인설명서] M월 D일 요일 모닝 시황"
        heading_style: "숫자. 이모지 제목 (부제)"
        headings: ["📌 오늘의 3줄 요약 (가장 중요!)",
                   "🔍 10년 차의 아주 쉬운 시황 분석",
                   "🛡️ 코린이 맞춤 매매 가이드",
                   "💬 아웃트로"]
        slots: [주간시황, 이슈해설, 주간복습]
        # 실제 시황 글에는 이미지가 없습니다. (표본 4편 모두 0장 — 2026-08-24 확인)
        # 그래서 이 틀에서는 이미지가 없어도 검수를 통과시킵니다.
        images_required: false
      guide:                        # 매매팁·투자마인드
        category: 코인투자마인드
        title_prefix: "[코린이 매매팁]"
        title_format: '[코린이 매매팁] "독자 질문" 무엇을 알려주는지 (개념명) 이모지'
        heading_style: "이모지 숫자. 제목"
        headings: ["💡 오늘의 친절한 한 줄 요약"]   # 나머지는 글마다 다름
        slots: [기초개념, 투자마인드, 위험관리]
        related_posts_block: true   # 끝에 관련 글 링크 4개
        images_required: true       # 실측 3~9장

    publish:
      days: [mon, tue, wed, thu, fri, sat]
      time: "08:30"          # 실제 발행 08:30~09:00 중 이른 쪽 (2026-08-22 확인)

    # 실제 글은 3편 모두 13개였습니다.
    hashtags:
      min: 12
      max: 14
      base: [코인시황, 비트코인, 알트코인, 가상자산, 암호화폐, 코린이, 코인투자, 크립토]
      common: [현금관망, 오늘의시황, 주식시황]
      # 나머지는 그 글의 주제어로 채웁니다 (예: 비트도미넌스, 분할매수, 주말장세)

    design:
      primary_color: "#2B6CB0"
      accent_color: "#F6AD55"
      mood: 검정 배경에 네온·그라데이션, 세로형 인포그래픽 포스터
      ai_tool: 챗GPT
      aspect: 세로형 3:4
      # 실제 블로그 이미지를 캡처로 확인한 결과입니다. (2026-08-22)
      #   · 세로형 포스터. 상단 큰 제목 → 번호 매긴 단계(①②③) → 하단 슬로건
      #   · 검정 배경에 형광 파랑·주황·초록. 대비가 아주 강합니다.
      #   · 얼굴 달린 비트코인 같은 의인화 캐릭터가 자주 나옵니다.
      #   · 본문의 비유를 그대로 그림으로 옮깁니다. (피자 비유 → 피자 그림)

    # ── 검수 기준 (실제 글 3편 실측값 기반, 2026-08-20~21) ──
    #    실측: 본문 1,310~1,448자 / 평균 문장 31자 / 90자 초과 0개
    #          도입부 214~272자 / 소제목 3~4개 / 해시태그 13개
    review_targets:
      calibrated_from: 3
      min_chars: 1150
      max_chars: 1750
      intro_max_chars: 300        # 실측 214~272자
      headings_min: 3
      headings_max: 5             # 실측 3~4개
      avg_sentence_chars: 31      # 실측 평균 31자 (3편 모두 동일)
      max_sentence_chars: 80      # 실측 최장 73자
      long_sentence_ratio: 0.05   # 실측 90자 초과 0%
      images_min: 1
      images_max: 5
    style_file: config/style_coin.md

  # ─────────────────────────────────────────────────────────
  stock:
    key: stock
    name: 오락 5070 경제공부소
    blog_id: playorak
    url: https://blog.naver.com/playorak
    confirm_phrase: "오락 5070 경제공부소 / playorak"

    audience:
      summary: 50~70대를 포함한 주식·경제 공부 입문자
      knowledge_level: 입문
      assumed_age: 50-70
      pain_points:
        - 경제 뉴스의 용어가 낯설다
        - 빠른 호흡의 설명은 따라가기 어렵다
        - 어디서부터 공부해야 할지 모른다

    topics:
      - 주식 초보 경제 공부
      - 주식 기초 개념
      - 경제 뉴스와 시장 흐름 설명

    tone:
      voice: 짧고 쉬운 문장, 차분한 설명
      rules:
        - 한 문장은 되도록 짧게 쓴다
        - 전문용어는 생활 속 예시로 바꿔 설명한다
        - 글자 크기와 줄바꿈으로 읽기 편하게 만든다
      forbidden:
        - 지나치게 빠른 호흡
        - 젊은 세대 은어·유행어
        - 특정 종목의 수익을 보장하는 표현
      required:
        - 투자 권유가 아닌 교육 목적임을 명시

    # 실제 블로그에서 쓰고 있는 문구 그대로입니다. (2026-08-21 글 기준)
    disclaimer: |
      이 글은 주식과 경제를 공부하기 위한 교육 콘텐츠이며 특정 종목의 매수·매도를 권유하는 글이 아닙니다.

    # 글 끝에 붙는 고정 소개 문단 (실제 글에서 확인)
    footer: |
      오락(ORAK) 5070 경제공부소 경제와 주식을 처음 공부하는 50·60·70대를 위해 어려운 경제 이야기를 쉬운 말로 하나씩 설명합니다. 관악구에서 진행하는 오프라인 경제·재테크 공부 모임에서도 차트 보는 법과 기초 개념을 눈높이에 맞추어 차근차근 함께 연습해 볼 수 있습니다.

    # 글 첫 줄 고정 인사말 (실제 글에서 확인)
    greeting: "안녕하세요. 오락(ORAK) 5070 경제공부소입니다."

    # 제목 말머리 — 2026-08-24 사용자 확정
    #   실제 글에는 "[주식완전기초]-" 와 "[주식완전기초] -" 가 섞여 있었습니다.
    #   앞으로는 **하이픈 앞에 공백을 두지 않는** 쪽으로 통일합니다.
    title_prefix: "[주식완전기초]-"
    title_format: "[주식완전기초]- 독자 지목 또는 되묻는 말, 주제 + 쉬움 약속"
    title_prefix_alternatives:
      - "[경제상식]-"          # 금리·물가처럼 경제 일반을 다룰 때
    heading_style: "장식 없는 평문 (번호·이모지·기호를 붙이지 않습니다)"
    headings: ["오늘 이것만 기억하세요.",
               "아주 쉽게 설명해 드릴게요",
               "주식에서는 어떻게 활용할까요?",
               "초보자가 많이 하는 실수",
               "오늘의 3줄 정리",
               "댓글 질문"]
    images_required: true       # 실측 3~4장

    publish:
      days: [mon, tue, wed, thu, fri, sat]
      time: "07:30"

    # 실제 글의 태그 구성: 독자층 + 주제 + 일반 + 연령 타깃 (7개)
    #   #주식초보 #주식차트보는법 #양봉음봉 #주식캔들 #주식공부 #50대재테크 #60대재테크
    hashtags:
      min: 6
      max: 8
      base: [주식초보, 주식공부]          # 거의 매번 들어가는 것
      age_target: [50대재테크, 60대재테크]  # 연령 타깃 (고정)
      # 나머지는 그 글의 주제어로 채웁니다 (예: 주식차트보는법, 양봉음봉, 주식캔들)

    design:
      primary_color: "#2F855A"
      accent_color: "#D69E2E"
      mood: 편안한 초록 계열, 큰 글씨, 여백 넉넉하게
      ai_tool: 챗GPT
      aspect: 가로형 4:3
      # 50~70대 독자용입니다. 요소를 적게 넣고 글씨를 크게 씁니다.

    # ── 검수 기준 (실제 글 4편 실측값 기반, 2026-08-18~21) ──
    #    실측: 본문 1,268~1,377자 / 평균 문장 33~38자 / 90자 초과 0~1개
    review_targets:
      calibrated_from: 1          # 표본 수
      min_chars: 1100             # 실측 1,383자 → 여유 두고 하한
      max_chars: 2200
      intro_max_chars: 250        # 실측 238자 (원지시서의 100자와 다름)
      headings_min: 3
      headings_max: 5             # 실측 4개
      avg_sentence_chars: 35      # 실측 평균 35자
      max_sentence_chars: 90      # 실측 최대 95자, 90자 초과는 2%뿐
      long_sentence_ratio: 0.08   # 90자 초과 문장 허용 비율
      images_min: 2
      images_max: 5               # 실측 3장
    style_file: config/style_stock.md

# ═══════════════════════════════════════════════════════════════
#  요일별 기본 편성
# ═══════════════════════════════════════════════════════════════
weekly_plan:
  # advance_write: false  → 미리 쓰지 않습니다. 발행일 당일(또는 하루 전)에 씁니다.
  #   시황·뉴스·일정 글은 며칠 전에 써 두면 발행 시점에 이미 틀린 내용이 됩니다.
  #   그래서 주간 일괄 생성에서 빼고, 당일에 최신 자료로 씁니다.
  coin:
    mon: { slot: 주간시황,   title_hint: "지난주 코인 시장 요약과 이번 주 핵심 일정", needs_live_data: true,  advance_write: false }
    tue: { slot: 기초개념,   title_hint: "코인 초보 기초 개념",                      needs_live_data: false, advance_write: true }
    wed: { slot: 이슈해설,   title_hint: "주요 코인 또는 시장 이슈 설명",             needs_live_data: true,  advance_write: false }
    thu: { slot: 투자마인드, title_hint: "코인 투자 마인드",                          needs_live_data: false, advance_write: true }
    fri: { slot: 위험관리,   title_hint: "위험관리와 투자 원칙",                      needs_live_data: false, advance_write: true }
    sat: { slot: 주간복습,   title_hint: "한 주 시장 복습과 초보자 체크리스트",        needs_live_data: true,  advance_write: false }
  stock:
    mon: { slot: 주간일정,   title_hint: "이번 주 경제·증시 일정",                    needs_live_data: true,  advance_write: false }
    tue: { slot: 기초용어,   title_hint: "주식 기초 용어",                            needs_live_data: false, advance_write: true }
    wed: { slot: 뉴스해설,   title_hint: "최근 경제 뉴스 쉽게 해설",                  needs_live_data: true,  advance_write: false }
    thu: { slot: 기업분석,   title_hint: "재무제표 또는 기업 분석 기초",              needs_live_data: false, advance_write: true }
    fri: { slot: 실수와원칙, title_hint: "초보 투자자의 실수와 원칙",                 needs_live_data: false, advance_write: true }
    sat: { slot: 주간복습,   title_hint: "한 주 경제 공부 복습",                      needs_live_data: true,  advance_write: false }
