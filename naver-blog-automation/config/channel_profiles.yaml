# ═══════════════════════════════════════════════════════════════
#  채널 프로필 — 두 블로그의 정체성·독자·문체 규칙
#  ※ blog_id 는 채널이 뒤바뀌는 사고를 막는 최종 기준값입니다.
#     절대 임의로 수정하지 마세요.
# ═══════════════════════════════════════════════════════════════
version: 1
timezone: Asia/Seoul

channels:

  # ─────────────────────────────────────────────────────────
  coin:
    key: coin
    name: 친절한 코인 설명서
    blog_id: dylankim26
    url: https://blog.naver.com/dylankim26
    # 발행 직전 사람이 눈으로 대조하는 확인 문구 (채널 혼동 방지)
    confirm_phrase: "친절한 코인 설명서 / dylankim26"

    audience:
      summary: 가상화폐와 코인 투자를 처음 시작한 사람
      knowledge_level: 입문
      assumed_age: 제한 없음
      pain_points:
        - 용어가 어려워 뉴스를 읽어도 이해가 안 됨
        - 무엇을 기준으로 판단해야 할지 모름
        - 급등락에 감정적으로 흔들림

    topics:
      - 가상화폐 주간·일간 시황
      - 코인 투자 마인드

    tone:
      voice: 차분하고 친절한 설명형
      rules:
        - 초보자도 이해할 수 있는 쉬운 한국어를 쓴다
        - 어려운 용어가 나오면 그 자리에서 바로 풀어서 설명한다
        - 문장은 길게 늘어뜨리지 않는다
      forbidden:
        - 과도한 가격 예측
        - 매수·매도 유도
        - 수익 보장 표현
      required:
        - 투자 판단과 책임은 독자에게 있다는 고지

    disclaimer: |
      이 글은 정보 제공을 목적으로 작성했습니다.
      특정 가상자산의 매수나 매도를 권유하지 않으며,
      투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다.

    publish:
      days: [mon, tue, wed, thu, fri, sat]
      time: "07:00"

    hashtags:
      min: 5
      max: 10
      base: [코인공부, 가상화폐, 코인초보, 비트코인, 코인시황]

    design:
      primary_color: "#2B6CB0"
      accent_color: "#F6AD55"
      mood: 차분한 파랑 계열, 정돈된 느낌

    # ── 검수 기준 (⚠ 아직 실제 글을 못 봐서 임시값입니다) ──
    #    샘플을 받으면 실측값으로 교체합니다.
    review_targets:
      calibrated_from: 0          # 0 = 미측정, 이 상태에서는 글자 수로 막지 않습니다
      min_chars: 1100
      max_chars: 2200
      intro_max_chars: 250
      headings_min: 3
      headings_max: 6
      avg_sentence_chars: 40
      max_sentence_chars: 90
      long_sentence_ratio: 0.15
      images_min: 1
      images_max: 5
    style_file: config/style_coin.md

  # ─────────────────────────────────────────────────────────
  stock:
    key: stock
    name: 오락 5070 경제공부소
    blog_id: playorak
    url: https://blog.naver.com/playorak
    confirm_phrase: "오락 5070 경제공부소 / playorak"

    audience:
      summary: 50~70대를 포함한 주식·경제 공부 입문자
      knowledge_level: 입문
      assumed_age: 50-70
      pain_points:
        - 경제 뉴스의 용어가 낯설다
        - 빠른 호흡의 설명은 따라가기 어렵다
        - 어디서부터 공부해야 할지 모른다

    topics:
      - 주식 초보 경제 공부
      - 주식 기초 개념
      - 경제 뉴스와 시장 흐름 설명

    tone:
      voice: 짧고 쉬운 문장, 차분한 설명
      rules:
        - 한 문장은 되도록 짧게 쓴다
        - 전문용어는 생활 속 예시로 바꿔 설명한다
        - 글자 크기와 줄바꿈으로 읽기 편하게 만든다
      forbidden:
        - 지나치게 빠른 호흡
        - 젊은 세대 은어·유행어
        - 특정 종목의 수익을 보장하는 표현
      required:
        - 투자 권유가 아닌 교육 목적임을 명시

    # 실제 블로그에서 쓰고 있는 문구 그대로입니다. (2026-08-21 글 기준)
    disclaimer: |
      이 글은 주식과 경제를 공부하기 위한 교육 콘텐츠이며 특정 종목의 매수·매도를 권유하는 글이 아닙니다.

    # 글 끝에 붙는 고정 소개 문단 (실제 글에서 확인)
    footer: |
      오락(ORAK) 5070 경제공부소 경제와 주식을 처음 공부하는 50·60·70대를 위해 어려운 경제 이야기를 쉬운 말로 하나씩 설명합니다. 관악구에서 진행하는 오프라인 경제·재테크 공부 모임에서도 차트 보는 법과 기초 개념을 눈높이에 맞추어 차근차근 함께 연습해 볼 수 있습니다.

    # 글 첫 줄 고정 인사말 (실제 글에서 확인)
    greeting: "안녕하세요. 오락(ORAK) 5070 경제공부소입니다."

    publish:
      days: [mon, tue, wed, thu, fri, sat]
      time: "07:30"

    # 실제 글의 태그 구성: 독자층 + 주제 + 일반 + 연령 타깃 (7개)
    #   #주식초보 #주식차트보는법 #양봉음봉 #주식캔들 #주식공부 #50대재테크 #60대재테크
    hashtags:
      min: 6
      max: 8
      base: [주식초보, 주식공부]          # 거의 매번 들어가는 것
      age_target: [50대재테크, 60대재테크]  # 연령 타깃 (고정)
      # 나머지는 그 글의 주제어로 채웁니다 (예: 주식차트보는법, 양봉음봉, 주식캔들)

    design:
      primary_color: "#2F855A"
      accent_color: "#D69E2E"
      mood: 편안한 초록 계열, 큰 글씨, 여백 넉넉하게

    # ── 검수 기준 (실제 글 1편 실측값 기반, 2026-08-21) ──
    #    표본이 늘면 다시 조정합니다.
    review_targets:
      calibrated_from: 1          # 표본 수
      min_chars: 1100             # 실측 1,383자 → 여유 두고 하한
      max_chars: 2200
      intro_max_chars: 250        # 실측 238자 (원지시서의 100자와 다름)
      headings_min: 3
      headings_max: 5             # 실측 4개
      avg_sentence_chars: 35      # 실측 평균 35자
      max_sentence_chars: 90      # 실측 최대 95자, 90자 초과는 2%뿐
      long_sentence_ratio: 0.08   # 90자 초과 문장 허용 비율
      images_min: 2
      images_max: 5               # 실측 3장
    style_file: config/style_stock.md

# ═══════════════════════════════════════════════════════════════
#  요일별 기본 편성
# ═══════════════════════════════════════════════════════════════
weekly_plan:
  coin:
    mon: { slot: 주간시황,   title_hint: "지난주 코인 시장 요약과 이번 주 핵심 일정", needs_live_data: true }
    tue: { slot: 기초개념,   title_hint: "코인 초보 기초 개념",                      needs_live_data: false }
    wed: { slot: 이슈해설,   title_hint: "주요 코인 또는 시장 이슈 설명",             needs_live_data: true }
    thu: { slot: 투자마인드, title_hint: "코인 투자 마인드",                          needs_live_data: false }
    fri: { slot: 위험관리,   title_hint: "위험관리와 투자 원칙",                      needs_live_data: false }
    sat: { slot: 주간복습,   title_hint: "한 주 시장 복습과 초보자 체크리스트",        needs_live_data: true }
  stock:
    mon: { slot: 주간일정,   title_hint: "이번 주 경제·증시 일정",                    needs_live_data: true }
    tue: { slot: 기초용어,   title_hint: "주식 기초 용어",                            needs_live_data: false }
    wed: { slot: 뉴스해설,   title_hint: "최근 경제 뉴스 쉽게 해설",                  needs_live_data: true }
    thu: { slot: 기업분석,   title_hint: "재무제표 또는 기업 분석 기초",              needs_live_data: false }
    fri: { slot: 실수와원칙, title_hint: "초보 투자자의 실수와 원칙",                 needs_live_data: false }
    sat: { slot: 주간복습,   title_hint: "한 주 경제 공부 복습",                      needs_live_data: true }
