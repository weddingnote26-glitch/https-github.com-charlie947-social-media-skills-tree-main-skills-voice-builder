# ═══════════════════════════════════════════════════════════════
#  시세·시장 자료의 기준 출처
#  (2026-08-22 사용자 지정)
# ═══════════════════════════════════════════════════════════════
#
#  시장 주가·시장 동향·시세는 여기 적힌 기준 출처를 봅니다.
#  다른 곳에서 본 숫자를 기준 출처 확인 없이 쓰지 않습니다.
#
version: 1

primary:
  name: "트레이딩뷰"
  name_en: "TradingView"
  url: "https://kr.tradingview.com/"
  designated_at: "2026-08-22"
  designated_by: "사용자 지정"
  # 이 출처로 볼 수 있는 자료의 종류
  covers: [시세, 지수, 환율, 차트, 시장동향]

# ── 자료 종류에 따라 필요한 출처 수가 다릅니다 ──────────────
#
#  quote  : 화면에서 읽는 값 (가격·지수·환율·등락률·도미넌스)
#           → 기준 출처 한 곳이면 됩니다. 차트에서 눈으로 확인한 값이니까요.
#  claim  : 사건·결정·발표 (ETF 승인, 금리 인하, 규제 발표, 상장·폐지)
#           → 서로 다른 출처 2곳이 필요합니다. 트레이딩뷰만으로는 안 됩니다.
#
rules:
  quote:
    min_sources: 1
    must_include_primary: true      # 기준 출처가 반드시 들어가야 합니다
    note: "트레이딩뷰 화면에서 읽은 값. 캡처를 남겨 두면 나중에 확인하기 좋습니다."
  claim:
    min_sources: 2
    must_include_primary: false
    note: "사건·발표는 언론 등 서로 다른 출처 2곳으로 교차 확인합니다."

# ── 자주 보는 항목 ─────────────────────────────────────────
#
#  아래 8개 주소는 2026-08-24 에 모두 열어 확인했습니다. (전부 정상 응답)
#  화면 구성이 바뀌어 다르게 보이면 url 을 고치고 verified 를 false 로 되돌리세요.
#
#  값은 메뉴 9번(또는 npm run update:sources)이 자동으로 받아 옵니다.
#  아래 주소는 그 값을 눈으로 맞춰 볼 때 씁니다.
#
watchlist:
  coin:
    - key: btc
      label: "비트코인"
      symbol: "BTCUSD"
      url: "https://kr.tradingview.com/symbols/BTCUSD/"
      verified: true
    - key: eth
      label: "이더리움"
      symbol: "ETHUSD"
      url: "https://kr.tradingview.com/symbols/ETHUSD/"
      verified: true
    - key: btc_dominance
      label: "비트코인 도미넌스"
      symbol: "BTC.D"
      url: "https://kr.tradingview.com/symbols/CRYPTOCAP-BTC.D/"
      verified: true
    - key: total_mcap
      label: "가상자산 시가총액 합계"
      symbol: "TOTAL"
      url: "https://kr.tradingview.com/symbols/CRYPTOCAP-TOTAL/"
      verified: true

  stock:
    - key: kospi
      label: "코스피"
      symbol: "KOSPI"
      url: "https://kr.tradingview.com/symbols/KRX-KOSPI/"
      verified: true
    - key: kosdaq
      label: "코스닥"
      symbol: "KOSDAQ"
      url: "https://kr.tradingview.com/symbols/KRX-KOSDAQ/"
      verified: true
    - key: usdkrw
      label: "원·달러 환율"
      symbol: "USDKRW"
      url: "https://kr.tradingview.com/symbols/USDKRW/"
      verified: true
    - key: sp500
      label: "S&P 500"
      symbol: "SPX"
      url: "https://kr.tradingview.com/symbols/SPX/"
      verified: true

# ── 자동으로 값을 받아 오는 곳 ─────────────────────────────
#
#  메뉴 9번이 아래 출처에서 값을 직접 받아 sources.md 에 적습니다.
#  트레이딩뷰처럼 **화면에서 읽는 값(quote)** 으로 인정합니다.
#  즉 출처 칸에 아래 이름이 적혀 있으면 한 곳만으로도 통과합니다.
#
#  ⚠ 여기 없는 이름을 출처 칸에 적으면 사건(claim)으로 보고 2곳을 요구합니다.
#     새 출처를 쓰기 시작하면 이 목록에 먼저 추가하세요.
#
auto_sources:
  - name: "CoinGecko"
    url: "https://www.coingecko.com/"
    covers: [시세, 도미넌스, 시가총액]
  - name: "Yahoo Finance"
    url: "https://finance.yahoo.com/"
    covers: [지수, 환율]
  - name: "Frankfurter"
    url: "https://www.frankfurter.app/"
    covers: [환율]
  - name: "CoinMarketCap"
    url: "https://coinmarketcap.com/"
    covers: [시세]

# ── 알아두실 것 ────────────────────────────────────────────
#
#  검사기는 출처 칸에 적힌 '이름'을 보고 시세인지 사건인지 나눕니다.
#  즉 어디서 봤는지는 적는 사람을 믿습니다.
#  뉴스에서 본 값을 '트레이딩뷰'라고 적으면 검사기는 시세로 보고 통과시킵니다.
#  이건 편의를 위한 규칙이지 부정을 막는 장치가 아닙니다.
#  실제로 트레이딩뷰 화면에서 읽은 값에만 그렇게 적어 주세요.
#
# ── 기준 출처로 확인이 안 될 때 ────────────────────────────
#
#  숫자를 지어내지 않습니다.
#  본문에서 그 숫자를 빼거나 `확인 필요` 로 남깁니다.
#
on_failure: mark_unverified
