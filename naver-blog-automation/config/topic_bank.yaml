version: 1

coin:
  기초개념:
    - 블록체인이 뭔지 택배 송장에 비유해 이해하기
    - 지갑 주소와 개인키의 차이
    - 거래소 지갑과 개인 지갑은 무엇이 다른가
    - 시가총액으로 코인의 덩치를 재는 법
    - 코인의 발행량과 반감기 개념
    - 스테이블코인은 왜 가격이 고정되어 있나
    - 가스비(수수료)는 왜 시간마다 달라지나
    - 메인넷과 토큰의 관계
    - 거래량이 알려주는 것과 알려주지 않는 것
    - 호가창과 슬리피지 이해하기
    - 김치 프리미엄이 생기는 이유
    - 스테이킹과 예금의 닮은 점과 다른 점
    - 에어드랍을 조심해야 하는 이유
    - 백서(whitepaper)를 읽는 최소한의 요령
    - 온체인 데이터가 뭘 보여주나
  투자마인드:
    - 남의 수익 인증을 봤을 때 마음을 지키는 법
    - 확신이 강할수록 위험한 이유
    - 손실을 인정하기 어려운 심리(손실 회피)
    - 코인 가격을 하루에 몇 번 확인해야 할까
    - 커뮤니티 분위기에 휩쓸리지 않기
    - 내가 감당할 수 있는 금액의 기준 세우기
    - 기다림도 전략이라는 말의 진짜 의미
    - 오른 뒤에 사고 싶어지는 마음의 정체
    - 투자 일기를 쓰면 달라지는 것
    - 정보와 소음을 구분하는 연습
    - 조급함이 만드는 반복되는 실수
    - 목표를 금액이 아니라 원칙으로 세우기
  위험관리:
    - 분할 매수가 위험을 줄이는 원리
    - 잃어도 되는 돈의 기준은 어떻게 정하나
    - 레버리지가 초보에게 위험한 이유
    - 거래소를 나눠 쓰는 이유
    - 2단계 인증과 계정 보안 기본기
    - 피싱 사이트를 구분하는 방법
    - 스캠 코인의 공통된 신호들
    - 포트폴리오에서 코인의 비중 정하기
    - 현금 비중을 남겨두는 이유
    - 자동 손절이 필요한 순간과 아닌 순간
    - 거래소가 문을 닫으면 벌어지는 일
    - 세금과 신고, 미리 알아둘 최소한

stock:
  기초용어:
    - 주식 한 주를 산다는 것의 의미
    - 시가총액으로 회사의 크기 재기
    - 배당금은 어디서 나오는 돈인가
    - PER를 국밥집 권리금에 비유하면
    - PBR이 알려주는 것
    - ROE는 무엇을 재는 자인가
    - 코스피와 코스닥의 차이
    - 상한가·하한가 제도 이해하기
    - 액면분할이 일어나면 생기는 일
    - 유상증자와 무상증자의 차이
    - 공매도를 쉽게 설명하면
    - 배당락일과 권리락일
    - ETF는 어떻게 여러 종목을 담는가
    - 채권 금리와 주식의 관계
    - 환율이 오르면 수출기업은 어떻게 되나
  기업분석:
    - 재무제표 세 장이 각각 말해주는 것
    - 매출과 영업이익과 순이익의 차이
    - 부채비율은 몇 %부터 걱정해야 하나
    - 현금흐름표를 가계부에 비유하면
    - 영업이익률로 회사의 체력 보기
    - 사업보고서에서 먼저 볼 세 곳
    - 공시를 확인하는 습관 들이기
    - 같은 업종끼리 비교해야 하는 이유
    - 매출이 늘어도 위험한 경우
    - 재고자산이 알려주는 신호
    - 대주주 지분 변화를 보는 법
    - 배당 성향으로 회사 성격 파악하기
  실수와원칙:
    - 하나의 종목에 전부 넣었을 때 생기는 일
    - 남의 추천만 듣고 산 뒤에 벌어지는 일
    - 물타기가 항상 답이 아닌 이유
    - 손실이 났을 때 더 사고 싶어지는 마음
    - 뉴스를 보고 사면 늦는 이유
    - 빚을 내서 투자하면 안 되는 이유
    - 매매를 자주 할수록 불리해지는 구조
    - 원칙을 글로 적어두면 달라지는 것
    - 계좌를 확인하는 적당한 횟수
    - 노후 자금과 투자 자금을 나누는 법
    - 유행하는 테마를 대하는 자세
    - 나이에 맞는 위험의 크기 생각하기

# 두 채널이 같은 소재를 다루지 못하도록 막는 금지 조합
cross_channel_guard:
  # 아래 키워드가 같은 주에 양쪽 원고에 모두 나오면 검수에서 경고합니다.
  shared_keywords_warn:
    - 금리
    - 인플레이션
    - 환율
    - 연준
    - FOMC
    - 물가
  # 이 주제들은 채널을 명확히 나눕니다.
  exclusive:
    coin: [비트코인, 이더리움, 알트코인, 거래소, 지갑, 스테이킹, 반감기]
    stock: [코스피, 코스닥, 배당, 재무제표, PER, PBR, ETF, 공시]
