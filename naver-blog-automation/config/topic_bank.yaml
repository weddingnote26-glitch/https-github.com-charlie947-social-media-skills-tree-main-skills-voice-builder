#  주제 은행 — 같은 소재가 반복되거나 두 채널이 겹치지 않도록
#  요일 슬롯별로 미리 나눠둔 주제 목록입니다.
#
#  · 사용한 주제는 output/<주차>/used_topics.json 에 기록되어
#    다음 주에는 다시 뽑히지 않습니다.
#  · 시황·뉴스 슬롯(needs_live_data: true)은 그 주에 실제로
#    일어난 일에서 소재를 뽑으므로 은행을 쓰지 않습니다.
#  · 두 채널의 주제는 의도적으로 서로 다른 영역으로 분리했습니다.
