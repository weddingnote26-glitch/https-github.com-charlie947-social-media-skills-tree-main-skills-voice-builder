# ═══════════════════════════════════════════════════════════════
#  개인 설정 — 이 파일을 config/settings.yaml 로 복사해서 쓰세요.
#  settings.yaml 은 .gitignore 에 있어 동기화되지 않습니다.
#  (PC마다 다를 수 있는 값이라 일부러 동기화하지 않습니다)
# ═══════════════════════════════════════════════════════════════
version: 1

# 이 PC를 구분하는 이름 (집/회사). 작업 충돌 경고에 쓰입니다.
machine_name: "집"

timezone: Asia/Seoul

# ── 예약 발행 시간 ─────────────────────────────────────────
# channel_profiles.yaml 의 기본값을 덮어씁니다.
publish_times:
  coin: "08:30"     # 실제 발행 습관 08:30~09:00 중 이른 쪽 (2026-08-22 확인)
  stock: "07:30"

# 공휴일에도 발행할지 여부
holidays:
  publish_on_holiday: true
  # false 로 두면 아래 날짜는 편성에서 제외됩니다 (YYYY-MM-DD)
  dates: []

# ── 예약 규칙 ──────────────────────────────────────────────
schedule:
  # 같은 채널의 두 글 사이 최소 간격(시간). 너무 촘촘하면 경고합니다.
  min_gap_hours: 12
  # 예약을 걸기 전에 지금 시각보다 최소 몇 시간 뒤여야 하는지
  min_lead_hours: 1

# ── 원고 생성 방식 ─────────────────────────────────────────
generation:
  # claude_code : 지시 패킷(brief)을 만들어 두고 Claude Code가 원고를 씁니다.
  #               API 키가 필요 없고 추가 비용이 들지 않습니다. (권장·기본값)
  # api         : Claude API를 직접 호출해 원고를 자동 생성합니다.
  #               환경변수 ANTHROPIC_API_KEY 가 필요합니다.
  mode: claude_code
  api:
    model: claude-opus-5
    max_tokens: 32000
    # 키는 절대 이 파일에 적지 마세요. 환경변수로만 전달합니다.
    api_key_env: ANTHROPIC_API_KEY

# ── 사실 확인 ──────────────────────────────────────────────
factcheck:
  # 수치 하나당 최소 몇 개 출처로 교차 확인할지
  min_sources: 2
  # 두 출처의 값 차이가 이 비율(%)을 넘으면 불일치로 봅니다
  tolerance_percent: 1.0
  # 캐시 유효 시간(분). 같은 자료를 반복해서 받지 않기 위함입니다.
  cache_ttl_minutes: 60
  # 자료 수집에 실패해도 원고 작성은 계속하되 '확인 필요'로 표시합니다.
  fail_mode: mark_unverified

# ── 검수 기준 ──────────────────────────────────────────────
review:
  # 이전 게시물과의 문장 유사도 상한 (0~1). 넘으면 경고합니다.
  max_similarity: 0.35
  # 두 채널 사이 내용 중복 상한
  max_cross_channel_similarity: 0.25
  # 본문 최소/최대 글자 수 (샘플 분석 후 채널별로 조정하세요)
  min_chars: 1200
  max_chars: 4000
  # 한 문장 최대 글자 수 (넘으면 '문장이 깁니다' 경고)
  max_sentence_chars: 90
  # 해시태그 개수 상한 — 채널 설정(channel_profiles.yaml)이 있으면 그쪽이 우선입니다.
  # 이건 채널 설정이 없을 때만 쓰는 예비값입니다.
  max_hashtags: 15
  # 검수를 통과하지 못해도 강제로 승인할 수 있게 할지 (권장: false)
  allow_force_approve: false

# ── 브라우저 예약 등록 보조 기능 ───────────────────────────
#  ⚠ 기본값은 꺼짐입니다. 켜기 전에 README의 '주의사항'을 읽어주세요.
browser:
  enabled: false

  # 두 블로그를 한 네이버 계정으로 쓰는지, 계정이 서로 다른지
  #   same_account      : 한 계정 → 블로그 전환 후 ID를 다시 확인합니다
  #   separate_accounts : 계정이 다름 → 채널마다 브라우저 프로필을 나눕니다
  account_mode: same_account

  # 로그인 프로필 저장 위치 (이 폴더는 절대 동기화하지 마세요)
  profile_dir: private/browser-profile
  # account_mode 가 separate_accounts 일 때 쓰는 채널별 폴더
  profile_dirs:
    coin: private/browser-profile/coin
    stock: private/browser-profile/stock
  # 처음에는 반드시 비공개(closed)로 1건만 시험하세요.
  first_run_visibility: closed
  # 한 번에 등록할 수 있는 최대 글 수 (안전장치)
  max_posts_per_run: 1
  # 화면 구조가 예상과 다르면 즉시 중단
  abort_on_layout_change: true
  # 사람이 보면서 진행하도록 항상 창을 띄웁니다
  headless: false
  # 각 단계 사이 대기 시간(초) — 너무 빠른 조작을 피합니다
  step_delay_seconds: 1.5

# ── 로그 ───────────────────────────────────────────────────
logging:
  level: INFO
  keep_days: 30
