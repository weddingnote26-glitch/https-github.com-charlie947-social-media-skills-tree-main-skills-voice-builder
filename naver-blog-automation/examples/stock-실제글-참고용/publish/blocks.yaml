  text: 오늘의 3줄 정리
- type: list
  style: number
  items:
  - text: 빨간색 막대(양봉)는 아침 시작 가격보다 마감 가격이 올랐다는 뜻입니다.
  - text: 파란색 막대(음봉)는 아침 시작 가격보다 마감 가격이 내렸다는 뜻입니다.
  - text: 양봉과 음봉은 어제 가격 기준이 아니라 '오늘 아침 시작 가격'과 비교한 결과입니다.
- type: paragraph
  text: 댓글 질문 여러분은 주식 차트를 볼 때 가장 헷갈리거나 궁금했던 점이 무엇이었나요? 편하게 댓글로 질문해 주세요!
  align: left
- type: paragraph
  text: 이 글은 주식과 경제를 공부하기 위한 교육 콘텐츠이며 특정 종목의 매수·매도를 권유하는 글이 아닙니다.
  align: left
- type: paragraph
  text: 오락(ORAK) 5070 경제공부소 경제와 주식을 처음 공부하는 50·60·70대를 위해 어려운 경제 이야기를 쉬운 말로 하나씩 설명합니다. 관악구에서 진행하는 오프라인
    경제·재테크 공부 모임에서도 차트 보는 법과 기초 개념을 눈높이에 맞추어 차근차근 함께 연습해 볼 수 있습니다.
  align: left
