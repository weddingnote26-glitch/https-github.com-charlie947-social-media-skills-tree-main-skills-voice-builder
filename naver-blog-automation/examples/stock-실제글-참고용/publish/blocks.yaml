- type: paragraph
  text: 안녕하세요. 오락(ORAK) 5070 경제공부소입니다. 스마트폰 주식 앱(HTS/MTS)을 열어보면 알록달록한 빨간색과 파란색 막대기들이 가득 차 있는 화면을 보신 적이
    있으실 겁니다.
  align: left
- type: paragraph
  text: 마치 암호처럼 복잡해 보여서 "차트 보는 건 전문가들이나 하는 거겠지" 하고 화면을 그냥 닫아버리곤 하셨나요? 하지만 이 막대기들의 규칙만 알면, 오늘 하루 주식시장에서
    매수자와 매도자가 어떤 줄다리기를 했는지 아주 쉽게 알 수 있습니다.
  align: left
- type: paragraph
  text: 오늘 이것만 기억하세요. 빨간색(양봉)은 시작할 때보다 가격이 올랐다는 뜻이고, 파란색(음봉)은 내렸다는 뜻입니다.
  align: left
- type: heading
  level: 2
  text: 아주 쉽게 설명해 드릴게요
- type: paragraph
  text: 차트에 나오는 막대기를 양초처럼 생겼다고 해서 '캔들(봉)'이라고 부릅니다. 한국 주식시장에서는 색깔로 방향을 표시합니다.
  align: left
- type: list
  style: bullet
  items:
  - text: '빨간 막대(양봉, 陽棒): 해가 뜨듯이 기분 좋게 가격이 올라간 것입니다. 아침 9시 시장이 열렸을 때 가격(시작 가격)보다, 오후 3시 30분 시장이 끝났을 때
      가격(마감 가격)이 더 높게 끝났다는 뜻입니다.'
    emphasis:
    - 빨간 막대(양봉, 陽棒)
- type: list
  style: bullet
  items:
  - text: '파란 막대(음봉, 陰棒): 그늘이 지듯이 가격이 떨어진 것입니다. 아침에 시작한 가격보다 마감한 가격이 더 낮게 끝났다는 뜻입니다.'
    emphasis:
    - 파란 막대(음봉, 陰棒)
- type: paragraph
  text: 줄다리기로 비유해 볼까요? 빨간색은 사려는 사람들의 힘이 더 강해서 줄을 위로 끌어올린 날이고, 파란색은 팔려는 사람들의 힘이 더 강해서 줄이 아래로 끌려 내려간 날이라고
    생각하시면 됩니다.
  align: left
- type: image
  index: 2
  file: images/02_candle-basic-02.png
  caption: null
  source_file: candle-basic-02.png
- type: heading
  level: 2
  text: 주식에서는 어떻게 활용할까요?
- type: paragraph
  text: 막대기 위아래로 가느다란 꼬리(선)가 달려 있는 것도 보셨을 겁니다. 이 꼬리는 "오늘 하루 동안 가장 높이 올라갔던 가격"과 "가장 낮게 떨어졌던 가격"의 흔적입니다.
    예를 들어, 긴 빨간 막대기 위에 긴 꼬리가 달려 있다면 무슨 뜻일까요? "낮에 가격이 아주 높이 올라갔다가, 장 마감 즈음에 팔려는 사람들이 많아져서 조금 내려와 끝났다"는
    뜻입니다. 이렇게 막대기 색깔과 꼬리 모양만 보아도 "오늘 투자자들이 이 주식을 얼마나 사고 싶어 했는지, 혹은 서둘러 팔고 싶어 했는지" 분위기를 한눈에 파악할 수 있습니다.
  align: left
- type: heading
  level: 2
  text: 초보자가 많이 하는 실수
- type: paragraph
  text: 첫째, "어제보다 떨어졌는데 빨간 막대(양봉)가 나와서 헷갈려합니다." 양봉과 음봉은 '어제 가격' 기준이 아니라 '오늘 아침 시작 가격' 기준입니다. 예를 들어 어제
    10,000원에 끝난 주식이 오늘 아침 9,000원에 시작해서 9,500원으로 끝났다면, 어제보다는 떨어졌지만 오늘 시작 가격(9,000원)보다는 올랐기 때문에 빨간 막대(양봉)가
    그려집니다. 둘째, "빨간 막대만 보고 무조건 좋아 보인다고 바로 매수합니다." 양봉이 나왔다고 해서 내일도 무조건 오르는 것은 아닙니다. 하루하루의 막대기 하나에 일희일비하기보다는,
    이 막대기들이 모여서 전체적으로 올라가는 흐름인지 내려가는 흐름인지(추세)를 함께 보아야 합니다.
  align: left
